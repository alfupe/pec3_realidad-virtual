<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Escena 2 - Vídeo 360º con a-videosphere</title>
    <meta name="description" content="PEC 3: Escena 2 con vídeo 360 y control de reproducción">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <style>
        #btnControl {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 999;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #fff;
            border-radius: 4px;
            cursor: pointer;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
        }
        #btnControl:hover {
            background: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <button id="btnControl">Reproducir / Pausar</button>

    <a-scene>
        <a-assets>
            <video id="videoSubmarino"
                   src="video360.mp4"
                   autoplay
                   loop="true"
                   muted="true"
                   playsinline
                   webkit-playsinline>
            </video>
            <a-asset-item id="modeloManta" src="mantaraya.glb"></a-asset-item>
        </a-assets>

        <a-videosphere src="#videoSubmarino" rotation="0 -90 0"></a-videosphere>

        <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
        <a-light type="directional" position="1 4 -2" intensity="0.6"></a-light>

        <!-- Modelo 3D: Mantarraya -->
        <a-entity id="contenedor-manta" position="0 0 -2.2">
            <a-entity id="mantarraya-submarina"
                      gltf-model="#modeloManta"
                      rotation="0 85 0"
                      scale="0.8 0.8 0.8"
                      animation__flotar="property: position; dir: alternate; dur: 3200; loop: true; easing: easeInOutSine; from: 0 0.4 0; to: 0 0.8 0"
                      animation__ondular="property: rotation; dir: alternate; dur: 4000; loop: true; easing: easeInOutSine; from: -5 70 -5; to: 5 100 5">
            </a-entity>
        </a-entity>

        <a-camera>
            <a-cursor color="#ffffff"></a-cursor>
        </a-camera>
    </a-scene>

    <script>
        const iniciarControlVideo = () => {
            const video = document.querySelector('#videoSubmarino');
            const btn = document.querySelector('#btnControl');

            const actualizarBoton = () => {
                btn.textContent = video.paused ? 'Reproducir vídeo' : 'Pausar vídeo';
            };

            video.addEventListener('play', actualizarBoton);
            video.addEventListener('pause', actualizarBoton);

            btn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    actualizarBoton();
                });
            }
        };

        const iniciarInteraccionManta = () => {
            const contenedorManta = document.querySelector('#contenedor-manta');
            const manta = document.querySelector('#mantarraya-submarina');

            const moverEnProfundidad = (posicionZ, duracion, retardo = 0) => {
                setTimeout(() => {
                    contenedorManta.setAttribute('animation__huida', {
                        property: 'position',
                        to: posicionZ,
                        dur: duracion,
                        easing: 'easeInOutQuad'
                    });
                }, retardo);
            };

            manta.addEventListener('mouseenter', () => {
                moverEnProfundidad('0 0.3 -6.0', 1000);
            });

            manta.addEventListener('mouseleave', () => {
                moverEnProfundidad('0 0 -2.2', 1800, 600);
            });
        };

        iniciarControlVideo();
        iniciarInteraccionManta();
    </script>
</body>
</html>
