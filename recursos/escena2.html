<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Escena 2 - Vídeo 360º con a-videosphere</title>
    <meta name="description" content="PEC 3: Escena 2 con vídeo 360 y control de reproducción">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <style>
        /* Botón discreto en la esquina inferior izquierda */
        #btnControl {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 999;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #fff;
            border-radius: 4px;
            cursor: pointer;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
        }
        #btnControl:hover {
            background: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <button id="btnControl">Reproducir / Pausar</button>

    <a-scene>
        <!-- Declaración de recursos en assets -->
        <a-assets>
            <video id="videoSubmarino"
                   src="video360.mp4"
                   loop="true"
                   muted="true"
                   playsinline
                   webkit-playsinline>
            </video>
            <!-- Modelo 3D de mantarraya importado para enriquecer la Escena 2 -->
            <a-asset-item id="modeloManta" src="mantaraya.glb"></a-asset-item>
        </a-assets>

        <!-- Fondo esférico para el vídeo 360 -->
        <a-videosphere src="#videoSubmarino" rotation="0 -90 0"></a-videosphere>

        <!-- Luces ambientales y direccionales para el modelo 3D -->
        <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
        <a-light type="directional" position="1 4 -2" intensity="0.6"></a-light>

        <!-- Modelo 3D externo: Mantarraya planeando en la corriente submarina -->
        <!-- Incluye suave animación de planeo/balanceo e interacción de escala al mirarla con el cursor -->
        <a-entity id="mantarraya-submarina"
                  gltf-model="#modeloManta"
                  position="0 0.4 -3.2"
                  rotation="0 85 0"
                  scale="0.8 0.8 0.8"
                  animation="property: position; dir: alternate; dur: 3200; loop: true; easing: easeInOutSine; to: 0 0.8 -3.2"
                  animation__ondular="property: rotation; dir: alternate; dur: 4000; loop: true; easing: easeInOutSine; from: -5 70 -5; to: 5 100 5"
                  animation__hover="property: scale; startEvents: mouseenter; dur: 300; to: 1.1 1.1 1.1"
                  animation__leave="property: scale; startEvents: mouseleave; dur: 400; to: 0.8 0.8 0.8">
        </a-entity>

        <!-- Cámara con cursor para interactuar con los objetos de la escena -->
        <a-camera>
            <a-cursor color="#ffffff"></a-cursor>
        </a-camera>
    </a-scene>

    <script>
        var video = document.getElementById('videoSubmarino');
        var btn = document.getElementById('btnControl');

        btn.addEventListener('click', function () {
            if (video.paused) {
                video.play();
                btn.textContent = 'Pausar vídeo';
            } else {
                video.pause();
                btn.textContent = 'Reproducir vídeo';
            }
        });
    </script>
</body>
</html>
