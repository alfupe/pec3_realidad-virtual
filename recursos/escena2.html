<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Escena 2 - Vídeo 360º con a-videosphere</title>
    <meta name="description" content="PEC 3: Escena 2 con vídeo 360 y control de reproducción">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <style>
        /* Botón discreto en la esquina inferior izquierda */
        #btnControl {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 999;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #fff;
            border-radius: 4px;
            cursor: pointer;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
        }
        #btnControl:hover {
            background: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <button id="btnControl">Reproducir / Pausar</button>

    <a-scene>
        <!-- Declaración del vídeo en assets -->
        <a-assets>
            <video id="videoSubmarino"
                   src="video360.mp4"
                   loop="true"
                   muted="true"
                   playsinline
                   webkit-playsinline>
            </video>
        </a-assets>

        <!-- Fondo esférico para el vídeo 360 -->
        <a-videosphere src="#videoSubmarino" rotation="0 -90 0"></a-videosphere>

        <!-- Cámara -->
        <a-camera></a-camera>
    </a-scene>

    <script>
        var video = document.getElementById('videoSubmarino');
        var btn = document.getElementById('btnControl');

        btn.addEventListener('click', function () {
            if (video.paused) {
                video.play();
                btn.textContent = 'Pausar vídeo';
            } else {
                video.pause();
                btn.textContent = 'Reproducir vídeo';
            }
        });
    </script>
</body>
</html>
