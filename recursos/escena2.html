<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Escena 2 - Inmersión Submarina 360º (Vídeo)</title>
    <meta name="description" content="PEC 3: Escena 2 interactiva con a-videosphere">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
        // Controlador interactivo del vídeo y panel de control HUD
        AFRAME.registerComponent('video-controller', {
            init: function () {
                var video = document.querySelector('#diveVideo');
                var playBtn = document.querySelector('#btn-play');
                var playText = document.querySelector('#txt-play');
                var muteBtn = document.querySelector('#btn-mute');
                var muteText = document.querySelector('#txt-mute');
                var overlayNotice = document.querySelector('#overlay-notice');

                // Función alternar reproducción
                function togglePlay() {
                    if (video.paused) {
                        video.play();
                        if (playText) playText.setAttribute('value', 'PAUSAR');
                        if (overlayNotice) overlayNotice.setAttribute('visible', 'false');
                    } else {
                        video.pause();
                        if (playText) playText.setAttribute('value', 'REPRODUCIR');
                    }
                }

                // Función alternar silencio/audio
                function toggleMute() {
                    video.muted = !video.muted;
                    if (muteText) {
                        muteText.setAttribute('value', video.muted ? 'SONIDO: OFF' : 'SONIDO: ON');
                    }
                }

                if (playBtn) {
                    playBtn.addEventListener('click', togglePlay);
                    playBtn.addEventListener('mouseenter', function() {
                        playBtn.setAttribute('color', '#0284c7');
                    });
                    playBtn.addEventListener('mouseleave', function() {
                        playBtn.setAttribute('color', '#0369a1');
                    });
                }

                if (muteBtn) {
                    muteBtn.addEventListener('click', toggleMute);
                    muteBtn.addEventListener('mouseenter', function() {
                        muteBtn.setAttribute('color', '#0d9488');
                    });
                    muteBtn.addEventListener('mouseleave', function() {
                        muteBtn.setAttribute('color', '#0f766e');
                    });
                }

                // También permitir reproducir haciendo clic directamente en la escena
                window.addEventListener('click', function () {
                    if (video.paused) {
                        togglePlay();
                    }
                }, { once: true });
            }
        });
    </script>
</head>
<body>
    <a-scene video-controller>
        <!-- Gestor de Assets -->
        <a-assets>
            <video id="diveVideo"
                   src="video360.mp4"
                   loop="true"
                   playsinline
                   webkit-playsinline
                   muted="true"
                   crossorigin="anonymous">
            </video>
        </a-assets>

        <!-- Esfera panorámica 360º para vídeo equirrectangular -->
        <a-videosphere src="#diveVideo" rotation="0 -90 0"></a-videosphere>

        <!-- Iluminación -->
        <a-light type="ambient" color="#38bdf8" intensity="0.5"></a-light>

        <!-- Cámara con cursor e indicador visual de interacción -->
        <a-camera position="0 1.6 0">
            <a-cursor color="#38bdf8"
                      fuse="true"
                      fuse-timeout="1200"
                      raycaster="objects: .clickable"
                      animation__fusing="property: scale; from: 1 1 1; to: 0.2 0.2 0.2; dur: 1200; startEvents: fusing"
                      animation__mouseleave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave">
            </a-cursor>

            <!-- HUD de Buceo: Mensaje inicial para clic -->
            <a-entity id="overlay-notice" position="0 -0.45 -1.2">
                <a-plane width="1.4" height="0.22" color="#0f172a" opacity="0.85" material="shader: flat">
                    <a-text value="Haz clic o apunta para reproducir" align="center" width="2" color="#38bdf8"></a-text>
                </a-plane>
            </a-entity>
        </a-camera>

        <!-- CONSOLA / PANEL DE CONTROL INMERSIVO 3D FLOTANTE (Diving HUD) -->
        <a-entity position="0 0.8 -2.2" rotation="-15 0 0">
            <!-- Marco base del panel -->
            <a-plane width="2.2" height="0.9" color="#0f172a" opacity="0.88" material="shader: flat">
                <!-- Título del panel de inmersión -->
                <a-text value="CONSOLA DE BUCEO SUBMARINO" align="center" width="2.2" color="#38bdf8" position="0 0.32 0.02"></a-text>

                <!-- Telemetría simulada de inmersión -->
                <a-text value="Profundidad: -8.5 m  |  Temp: 28.5 C  |  Visibilidad: Optima"
                        align="center" width="1.8" color="#94a3b8" position="0 0.16 0.02"></a-text>

                <!-- Botón de PLAY / PAUSA -->
                <a-plane id="btn-play" class="clickable" width="0.85" height="0.26" color="#0369a1" position="-0.5 -0.15 0.02" material="shader: flat">
                    <a-text id="txt-play" value="REPRODUCIR" align="center" width="2" color="#ffffff" position="0 0 0.02"></a-text>
                </a-plane>

                <!-- Botón de SONIDO ON/OFF -->
                <a-plane id="btn-mute" class="clickable" width="0.85" height="0.26" color="#0f766e" position="0.5 -0.15 0.02" material="shader: flat">
                    <a-text id="txt-mute" value="SONIDO: OFF" align="center" width="2" color="#ffffff" position="0 0 0.02"></a-text>
                </a-plane>
            </a-plane>
        </a-entity>

        <!-- EFECTO AMBIENTAL: Burbujas ascendentes -->
        <a-entity position="1.5 0 -2">
            <a-sphere radius="0.05" color="#e0f2fe" opacity="0.6"
                      animation="property: position; from: 0 -0.5 0; to: 0 4 0; loop: true; dur: 3400; easing: easeInQuad"></a-sphere>
            <a-sphere radius="0.03" color="#e0f2fe" opacity="0.7" position="0.1 0 0.1"
                      animation="property: position; from: 0.1 -0.5 0.1; to: 0.1 4 0.1; loop: true; dur: 2900; delay: 1000; easing: easeInQuad"></a-sphere>
        </a-entity>

        <a-entity position="-1.8 0 -2.5">
            <a-sphere radius="0.06" color="#e0f2fe" opacity="0.5"
                      animation="property: position; from: 0 -0.5 0; to: 0 4 0; loop: true; dur: 3100; delay: 600; easing: easeInQuad"></a-sphere>
        </a-entity>
    </a-scene>
</body>
</html>
