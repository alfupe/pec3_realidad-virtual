<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Escena 1 - Panorámica 360º con a-sky</title>
    <meta name="description" content="PEC 3: Escena 1 con imagen 360 y modelo 3D">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- Declaración de recursos -->
        <a-assets>
            <img id="arrecife" src="arrecife360.jpg">
            <!-- Modelo 3D importado según paso 5 del tutorial -->
            <a-asset-item id="modeloPez" src="pez.glb"></a-asset-item>
        </a-assets>

        <!-- Fondo esférico de 360 grados con imagen fija -->
        <a-sky id="fondo-360" src="#arrecife" rotation="0 -70 0"></a-sky>

        <!-- Luz ambiental para que el modelo 3D se aprecie correctamente -->
        <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
        <a-light type="directional" position="1 4 -2" intensity="0.5"></a-light>

        <!-- Modelo 3D externo: Pez mariposa nadando en el arrecife -->
        <!-- Patrulla horizontal de lado a lado con giro de 180º; al pasar el cursor (mouseenter) reacciona acelerando el nado -->
        <a-entity id="contenedor-pez"
                  position="0 1.2 -3"
                  animation="property: position; dir: alternate; dur: 6000; loop: true; easing: easeInOutSine; from: -2.5 1.2 -3; to: 2.5 1.2 -3">
            <a-entity id="pez-arrecife"
                      gltf-model="#modeloPez"
                      scale="1.2 1.2 1.2"
                      rotation="0 90 0"
                      animation__flotar="property: position; dir: alternate; dur: 1500; loop: true; easing: easeInOutQuad; to: 0 0.15 0"
                      animation__huir="property: scale; startEvents: mouseenter; dur: 250; to: 1.6 1.6 1.6"
                      animation__calma="property: scale; startEvents: mouseleave; dur: 500; to: 1.2 1.2 1.2">
            </a-entity>
        </a-entity>

        <script>
            // Giro del pez según el sentido de la trayectoria y reacción de huida al interactuar
            var contenedor = document.getElementById('contenedor-pez');
            var pez = document.getElementById('pez-arrecife');
            var ultimoX = 0;

            contenedor.addEventListener('animationloop', function () {
                // Al cambiar de sentido en el bucle alternado, giramos el pez 180 grados
                var rotActual = pez.getAttribute('rotation');
                var nuevaY = (rotActual.y === 90) ? 270 : 90;
                pez.setAttribute('rotation', { x: 0, y: nuevaY, z: 0 });
            });

            // Reacción interactiva: al tocar al pez con el cursor, acelera temporalmente (huye)
            pez.addEventListener('mouseenter', function () {
                contenedor.setAttribute('animation', 'dur', 2000);
            });
            pez.addEventListener('mouseleave', function () {
                setTimeout(function () {
                    contenedor.setAttribute('animation', 'dur', 6000);
                }, 1000);
            });
        </script>


        <!-- Texto integrado en la escena 3D -->
        <a-text value="Arrecife de Coral 360"
                position="-1.6 2.6 -3"
                color="#ffffff"
                scale="1.2 1.2 1.2">
        </a-text>

        <!-- Cámara y cursor para interactuar con los objetos -->
        <a-camera>
            <a-cursor color="#ffffff"></a-cursor>
        </a-camera>
    </a-scene>
</body>
</html>
