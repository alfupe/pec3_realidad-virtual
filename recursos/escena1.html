<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Escena 1 - Panorámica 360º con a-sky</title>
    <meta name="description" content="PEC 3: Escena 1 con imagen 360 y elementos interactivos">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- Declaración de recursos -->
        <a-assets>
            <img id="arrecife" src="arrecife360.jpg">
        </a-assets>

        <!-- Fondo esférico de 360 grados -->
        <a-sky id="fondo-360" src="#arrecife" rotation="0 -70 0"></a-sky>

        <!-- Objeto 1: Caja interactiva que gira y reacciona al cursor con mouseenter -->
        <a-box position="-3 1.5 -5"
               rotation="0 30 20"
               scale="1.2 1.2 1.2"
               color="#0284c7"
               animation="property: position; dir: alternate; dur: 2000; loop: true; to: -3 1.8 -5"
               animation__mouseenter="property: rotation; startEvents: mouseenter; dur: 600; to: 0 390 20">
        </a-box>

        <!-- Objeto 2: Esfera flotante con animación continua -->
        <a-sphere position="3 2 -4"
                  radius="0.7"
                  color="#0d9488"
                  animation="property: scale; dir: alternate; dur: 1500; loop: true; to: 0.85 0.85 0.85">
        </a-sphere>

        <!-- Texto integrado en la escena -->
        <a-text value="Arrecife de Coral 360"
                position="-2 3 -5"
                color="#ffffff"
                scale="1.5 1.5 1.5">
        </a-text>

        <!-- Cámara con cursor para interacción -->
        <a-camera>
            <a-cursor color="#ffffff"></a-cursor>
        </a-camera>
    </a-scene>
</body>
</html>
