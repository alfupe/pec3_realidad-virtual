<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Escena 1 - Panorámica 360º con a-sky</title>
    <meta name="description" content="PEC 3: Escena 1 con imagen 360 y modelo 3D">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <a-assets>
            <img id="arrecife" src="arrecife360.jpg">
            <a-asset-item id="modeloPez" src="pez.glb"></a-asset-item>
        </a-assets>

        <a-sky id="fondo-360" src="#arrecife" rotation="0 -70 0" radius="10"></a-sky>

        <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
        <a-light type="directional" position="1 4 -2" intensity="0.5"></a-light>

        <!-- Modelo 3D: Pez mariposa -->
        <a-entity id="contenedor-pez" position="0 1.1 -1.8">
            <a-entity id="pez-arrecife"
                      gltf-model="#modeloPez"
                      scale="1.1 1.1 1.1"
                      rotation="0 90 0"
                      animation__flotar="property: position; dir: alternate; dur: 1400; loop: true; easing: easeInOutSine; from: 0 -0.05 0; to: 0 0.05 0">
            </a-entity>
        </a-entity>

        <script>
            const contenedor = document.querySelector('#contenedor-pez');
            const pez = document.querySelector('#pez-arrecife');

            const posZ = -1.8;
            const posY = 1.1;
            const limiteX = 1.7;
            const velocidadNormal = 0.007;

            let posX = 0;
            let direccion = 1; // 1 = derecha, -1 = izquierda
            let velocidad = velocidadNormal;
            let girando = false;

            const iniciarGiro = (anguloDestino, nuevaDireccion) => {
                girando = true;
                pez.setAttribute('animation__giro', {
                    property: 'rotation',
                    to: `0 ${anguloDestino} 0`,
                    dur: 700,
                    easing: 'easeInOutQuad'
                });

                setTimeout(() => {
                    direccion = nuevaDireccion;
                    girando = false;
                }, 750);
            };

            const animarNado = () => {
                if (!girando) {
                    posX += direccion * velocidad;

                    if (direccion === 1 && posX >= limiteX) {
                        iniciarGiro(-90, -1);
                    } else if (direccion === -1 && posX <= -limiteX) {
                        iniciarGiro(90, 1);
                    } else {
                        contenedor.setAttribute('position', `${posX} ${posY} ${posZ}`);
                    }
                }
                requestAnimationFrame(animarNado);
            };

            // Interacción: aceleración momentánea al enfocar con el cursor
            pez.addEventListener('mouseenter', () => {
                velocidad = velocidadNormal * 3.5;
            });

            pez.addEventListener('mouseleave', () => {
                setTimeout(() => {
                    velocidad = velocidadNormal;
                }, 800);
            });

            const escena = document.querySelector('a-scene');
            if (escena.hasLoaded) {
                animarNado();
            } else {
                escena.addEventListener('loaded', animarNado);
            }
        </script>

        <!-- Cámara y cursor para interactuar con los objetos -->
        <a-camera>
            <a-cursor color="#ffffff"></a-cursor>
        </a-camera>
    </a-scene>
</body>
</html>
